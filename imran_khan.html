<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imran Khan</title>
    <style>
                        @media (max-width: 900px) {
                            .comic-img, .comic-cover {
                                max-height: 90vh;
                                object-fit: contain;
                            }
                        }
                /* Universal responsive image style for all comic images */
                .comic-img, .comic-cover {
                    width: 100%;
                    height: auto;
                    max-width: 100vw;
                    display: block;
                }
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; box-shadow: 0 2px 8px #ccc; border-radius: 8px; padding: 24px; }
                        @media (max-width: 900px) {
                            .container {
                                max-width: 98vw;
                                padding: 10px 2vw 16px 2vw;
                            }
                            .title {
                                font-size: 1.3em;
                            }
                            .comic-img {
                                width: 100%;
                                height: auto;
                                max-height: none;
                            }
                        }
                        @media (min-width: 901px) {
                            .container {
                                max-width: 600px;
                                padding: 24px;
                            }
                            .title {
                                font-size: 2em;
                            }
                            .comic-img {
                                max-height: none;
                            }
                        }
                @media (max-width: 600px) {
                    .container {
                        max-width: 98vw;
                        padding: 10px 2vw 16px 2vw;
                    }
                    .title {
                        font-size: 1.3em;
                    }
                    .comic-img {
                        height: auto;
                        max-height: 220px;
                    }
                }
        .comic-img { width: 100%; margin-bottom: 16px; border-radius: 4px; }
        .title { text-align: center; font-size: 2em; margin-bottom: 16px; }
        .end-message { text-align: center; margin-top: 32px; font-size: 1.2em; }
        .links { text-align: center; margin-top: 16px; }
        .links a { display: inline-block; margin: 0 10px; padding: 10px 20px; background: #0078d4; color: #fff; border-radius: 4px; text-decoration: none; transition: background 0.2s; }
        .links a:hover { background: #005fa3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Imran Khan - Episode 1</div>
        <img src="./imran khan/1.png" alt="Comic Page 1" class="comic-img">
        <img src="./imran khan/2.png" alt="Comic Page 2" class="comic-img">
        <img src="./imran khan/3.png" alt="Comic Page 3" class="comic-img">
        <div class="end-message">
            Want to read more? Buy a subscription or order the book!
        </div>
        <div class="links">
            <a href="https://draz.com/your-comic-link" target="_blank">Go to Draz</a>
            <a href="https://wa.me/yourwhatsapplink" target="_blank">Order on WhatsApp</a>
        </div>
    </div>
</body>
</html>
